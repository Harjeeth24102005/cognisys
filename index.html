    <!-- SPA URL Restore for Clean GitHub Pages Routing & Legacy Hash Migration -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.hash && l.hash.startsWith('#/')) {
          var cleanSubpath = l.hash.slice(2);
          window.history.replaceState(null, null, '/' + cleanSubpath + (l.search || ''));
        }
      }(window.location))
    </script>
